[package]
name = "crypto-core"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
rand = "0.10.3"
num-bigint = "0.5.1"
sha2 = "0.11.1"
getrandom = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
ed25519-dalek = "2.2.0"

rayon = { version = "1.12.0", optional=true }
wasm-bindgen = { version = "0.2.130", optional=true }
js-sys = { version = "0.3.107", optional = true }
web-sys = { version = "0.3.107", optional = true }

[features]
default = []
rayon = ["dep:rayon"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys", "getrandom/wasm_js"]
